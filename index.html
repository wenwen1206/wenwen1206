<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問問</title>
<meta name="description" content="問問的小角落：想睡覺到永遠。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #8fcdf0;
    --sky-deep: #4a9fd1;
    --sky-soft: #dff1fb;
    --cream: #fff8ea;
    --cream-deep: #f6e8c9;
    --white: #ffffff;
    --ink: #3d5566;
    --ink-soft: #7c93a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: var(--sky-soft);
    background-image:
      radial-gradient(circle at 15% 10%, var(--white) 0 60px, transparent 61px),
      radial-gradient(circle at 22% 12%, var(--white) 0 45px, transparent 46px),
      radial-gradient(circle at 85% 30%, var(--white) 0 50px, transparent 51px),
      radial-gradient(circle at 78% 32%, var(--white) 0 35px, transparent 36px),
      linear-gradient(180deg, var(--sky-soft) 0%, var(--cream) 100%);
    background-color: var(--cream);
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    padding: 48px 16px 40px;
  }
  main {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* 頭像 */
  .avatar {
    width: 104px; height: 104px;
    border-radius: 50%;
    background: var(--cream);
    border: 4px solid var(--white);
    box-shadow: 0 0 0 3px var(--sky);
    display: grid; place-items: center;
    font-size: 44px; font-weight: 700;
    color: var(--sky-deep);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: .08em; }
  .bio {
    font-size: 15px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px;
  }
  .zzz { display: inline-block; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-4px); } }

  /* 興趣標籤 */
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .tag {
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--white);
    border: 2px solid var(--sky-soft);
  }
  .tag.sleep { background: var(--cream-deep); border-color: var(--cream-deep); font-weight: 700; }

  /* 輪播 */
  .marquee {
    width: 100%;
    height: 47px;
    overflow: hidden;
    border-radius: 14px;
    background: var(--white);
    border: 2px solid var(--white);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .track {
    display: flex;
    height: 100%;
    width: max-content;
    animation: slide var(--dur, 20s) linear infinite;
  }
  .marquee:hover .track { animation-play-state: paused; }
  .track img {
    height: 100%;
    width: auto;
    padding: 6px 8px;
    object-fit: contain;
    flex: none;
  }
  @keyframes slide {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* 連結按鈕：扁扁的 */
  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    background: var(--white);
    border: 2px solid var(--white);
    color: var(--ink);
    text-decoration: none;
    font-size: 16px; font-weight: 700;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    border-color: var(--sky);
    background: var(--cream);
    outline: none;
  }
  .link .ico {
    width: 32px; height: 32px; flex: none;
    border-radius: 10px;
    background: var(--sky-soft);
    color: var(--sky-deep);
    display: grid; place-items: center;
  }
  .link .ico svg { width: 18px; height: 18px; fill: currentColor; }
  .link .label { flex: 1; text-align: center; margin-right: 44px; }


  /* 作品區 */
  .works { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .works h2 { font-size: 17px; text-align: center; letter-spacing: .06em; margin: 8px 0 2px; }
  .works h2 small { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
  .work { background: var(--white); border-radius: 16px; overflow: hidden; }
  .work .note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* 卡片輪播（中間凸出、兩側斜斜的） */
  .works { overflow-x: clip; overflow-y: visible; margin: 0 -16px; padding: 0 16px 6px; width: calc(100% + 32px); }
  .deck { position: relative; width: 100%; perspective: 1000px; touch-action: pan-y; }
  .deck .work {
    position: absolute; top: 0; left: 50%;
    width: 76%;
    transition: transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s, filter .45s;
    box-shadow: 0 6px 18px rgba(74,159,209,.18);
  }
  .deck .work:not(.center) { cursor: pointer; filter: saturate(.8) brightness(.97); }
  .deck .work:not(.center) > * { pointer-events: none; }
  .deck-ctrl { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .deck-ctrl button {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--white);
    background: var(--white); color: var(--sky-deep); font: 700 18px/1 inherit; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .deck-ctrl button:hover { border-color: var(--sky); background: var(--cream); }
  .deck-ctrl .count { font-size: 13px; color: var(--ink-soft); min-width: 40px; text-align: center; }
  .work .body { padding: 12px 16px 14px; }
  .work .meta { display: flex; align-items: baseline; gap: 8px; }
  .work .title { font-size: 16px; font-weight: 700; color: var(--ink); text-decoration: none; }
  a.title:hover { color: var(--sky-deep); }
  a.title::after { content: " ↗"; font-size: 12px; color: var(--sky-deep); }
  .work .date { margin-left: auto; font-size: 12px; color: var(--ink-soft); flex: none; }
  .work .note { font-size: 14px; color: var(--ink-soft); margin-top: 4px; line-height: 1.6; }
  .slides { position: relative; aspect-ratio: 4 / 3; background: var(--cream); }
  .slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .3s; }
  .slides img.on { opacity: 1; }
  .slides .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.85); color: var(--sky-deep);
    font: 700 16px/1 inherit; cursor: pointer; display: grid; place-items: center;
  }
  .slides .nav:hover { background: var(--white); }
  .slides .prev { left: 8px; } .slides .next { right: 8px; }
  .slides .dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .slides .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.7); box-shadow: 0 0 0 1px var(--sky); }
  .slides .dots i.on { background: var(--sky-deep); }

  footer { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .track, .zzz { animation: none; }
  }
</style>
</head>
<body>

  <section class="works" id="works" hidden>
    <h2>睡醒時做的東西<small>做完就扔在這裡</small></h2>

    <div class="deck-ctrl" id="deckCtrl">
      <button type="button" id="deckPrev" aria-label="上一個作品">‹</button>
      <span class="count" id="deckCount"></span>
      <button type="button" id="deckNext" aria-label="下一個作品">›</button>
    </div>
  </section>

  <footer>☁ 正在睡覺，晚點回你</footer>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLqCrWEIetydwjFFAclHLZx4Bi2qP5f4SA01dKWfhZm9ghLd-gajuTRYdZLlq18EvzSwj6D43j-1NJ/pub?gid=934528779&single=true&output=csv";
  const AVATAR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLqCrWEIetydwjFFAclHLZx4Bi2qP5f4SA01dKWfhZm9ghLd-gajuTRYdZLlq18EvzSwj6D43j-1NJ/pub?gid=2013702964&single=true&output=csv";
  const PX_PER_SEC = 40; // 滾動速度，數字越大越快

  const track = document.getElementById("track");

  function build(urls) {
    if (!urls.length) { track.parentElement.style.display = "none"; return; }

    const makeImg = (src) => {
      const img = new Image();
      img.src = src; img.alt = ""; img.loading = "eager"; img.decoding = "async";
      return img;
    };

    // 先放一組，若寬度不足就重複，直到超過容器寬度
    const box = track.parentElement.clientWidth;
    const half = document.createElement("div");
    half.style.display = "flex";
    let guard = 0;
    do {
      urls.forEach(u => half.appendChild(makeImg(u)));
      guard++;
    } while (guard < 60 && half.childElementCount * 47 < box * 1.2);

    // 兩份一模一樣接起來，動畫移動 50% 就能無縫循環
    track.append(...half.cloneNode(true).childNodes, ...half.childNodes);

    const setDur = () => {
      const w = track.scrollWidth / 2;
      track.style.setProperty("--dur", Math.max(w / PX_PER_SEC, 4) + "s");
    };
    setDur();
    window.addEventListener("load", setDur);
  }

  fetch(CSV_URL)
    .then(r => r.text())
    .then(text => {
      const urls = (text.match(/https?:\/\/[^\s,"']+/g) || []);
      build(urls);
    })
    .catch(() => build([]));

  // 頭貼：抓表單裡第一個網址，載入失敗就維持「問」字
  fetch(AVATAR_CSV_URL)
    .then(r => r.text())
    .then(text => {
      const url = (text.match(/https?:\/\/[^\s,"']+/) || [])[0];
      if (!url) return;
      const img = new Image();
      img.alt = "問問的頭貼";
      img.referrerPolicy = "no-referrer";
      img.onload = () => document.getElementById("avatar").replaceChildren(img);
      img.src = url;
    })
    .catch(() => {});

  // 作品區
  const WORKS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLqCrWEIetydwjFFAclHLZx4Bi2qP5f4SA01dKWfhZm9ghLd-gajuTRYdZLlq18EvzSwj6D43j-1NJ/pub?gid=528442747&single=true&output=csv";

  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function slideshow(urls) {
    const box = el("div", "slides");
    const imgs = urls.map((u, i) => {
      const img = el("img", i === 0 ? "on" : "");
      img.src = u; img.alt = ""; img.loading = "lazy";
      box.appendChild(img);
      return img;
    });
    if (urls.length > 1) {
      let cur = 0;
      const dots = el("div", "dots");
      const dotEls = urls.map((_, i) => dots.appendChild(el("i", i === 0 ? "on" : "")));
      const go = (d) => {
        imgs[cur].classList.remove("on"); dotEls[cur].classList.remove("on");
        cur = (cur + d + urls.length) % urls.length;
        imgs[cur].classList.add("on"); dotEls[cur].classList.add("on");
      };
      const prev = el("button", "nav prev", "‹"); prev.setAttribute("aria-label", "上一張"); prev.onclick = () => go(-1);
      const next = el("button", "nav next", "›"); next.setAttribute("aria-label", "下一張"); next.onclick = () => go(1);
      box.append(prev, next, dots);
    }
    return box;
  }

  function setupDeck() {
    const deck = document.getElementById("deck");
    const cards = [...deck.children];
    const n = cards.length;
    let cur = 0;

    const render = () => {
      cards.forEach((c, i) => {
        let off = ((i - cur) % n + n) % n;
        if (off > n / 2) off -= n;
        const a = Math.abs(off);
        c.classList.toggle("center", off === 0);
        c.style.zIndex = 10 - a;
        c.style.opacity = a > 1 ? 0 : a === 1 ? .75 : 1;
        c.style.visibility = a > 1 ? "hidden" : "visible";
        c.style.transform =
          `translateX(calc(-50% + ${off * 46}%)) rotateY(${-off * 32}deg) scale(${a ? .82 : 1})`;
      });
      document.getElementById("deckCount").textContent = `${cur + 1} / ${n}`;
    };
    const go = (d) => { cur = (cur + d + n) % n; render(); };

    // 卡片高度不一樣，舞台取最高的那張
    const fit = () => { deck.style.height = Math.max(...cards.map(c => c.offsetHeight)) + "px"; };
    new ResizeObserver(fit).observe(deck);
    cards.forEach(c => new ResizeObserver(fit).observe(c));

    cards.forEach((c, i) => c.addEventListener("click", () => {
      if (!c.classList.contains("center")) { cur = i; render(); }
    }));
    document.getElementById("deckPrev").onclick = () => go(-1);
    document.getElementById("deckNext").onclick = () => go(1);

    // 手機左右滑
    let x0 = null;
    deck.addEventListener("pointerdown", e => { x0 = e.clientX; });
    deck.addEventListener("pointerup", e => {
      if (x0 === null) return;
      const dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    });

    if (n < 2) document.getElementById("deckCtrl").style.display = "none";
    render(); fit();
  }

  fetch(WORKS_CSV_URL)
    .then(r => r.text())
    .then(text => {
      const rows = parseCSV(text).slice(1)
        .filter(r => (r[1] || "").trim());
      rows.sort((a, b) => (b[0] || "").localeCompare(a[0] || "")); // 新的在上面
      const sec = document.getElementById("works");
      const deck = document.getElementById("deck");
      rows.forEach(r => {
        const [date, name, link, note] = r.map(x => (x || "").trim());
        const pics = r.slice(4).map(x => x.trim()).filter(x => /^https?:\/\//.test(x));
        const card = el("article", "work");
        if (pics.length) card.appendChild(slideshow(pics));
        const body = el("div", "body");
        const meta = el("div", "meta");
        let title;
        if (/^https?:\/\//.test(link)) {
          title = el("a", "title", name); title.href = link; title.target = "_blank"; title.rel = "noopener";
        } else title = el("span", "title", name);
        meta.append(title, el("span", "date", date));
        body.appendChild(meta);
        if (note) body.appendChild(el("p", "note", note));
        card.appendChild(body);
        deck.appendChild(card);
      });
      if (rows.length) { sec.hidden = false; setupDeck(); }
    })
    .catch(() => {});
</script>
</body>
