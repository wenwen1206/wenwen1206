<style>
  :root {
    --sky: #8fcdf0;
    --sky-deep: #4a9fd1;
    --sky-soft: #dff1fb;
    --cream: #fff8ea;
    --cream-deep: #f6e8c9;
    --white: #ffffff;
    --ink: #3d5566;
    --ink-soft: #7c93a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: var(--sky-soft);
    background-image:
      radial-gradient(circle at 15% 10%, var(--white) 0 60px, transparent 61px),
      radial-gradient(circle at 22% 12%, var(--white) 0 45px, transparent 46px),
      radial-gradient(circle at 85% 30%, var(--white) 0 50px, transparent 51px),
      radial-gradient(circle at 78% 32%, var(--white) 0 35px, transparent 36px),
      linear-gradient(180deg, var(--sky-soft) 0%, var(--cream) 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 48px 16px 40px;
  }
  main {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* 頭像 */
  .avatar {
    width: 104px; height: 104px;
    border-radius: 50%;
    background: var(--cream);
    border: 4px solid var(--white);
    box-shadow: 0 0 0 3px var(--sky);
    display: grid; place-items: center;
    font-size: 44px; font-weight: 700;
    color: var(--sky-deep);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: .08em; }
  .bio {
    font-size: 15px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px;
  }
  .zzz { display: inline-block; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-4px); } }

  /* 興趣標籤 */
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .tag {
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--white);
    border: 2px solid var(--sky-soft);
  }
  .tag.sleep { background: var(--cream-deep); border-color: var(--cream-deep); font-weight: 700; }

  /* 輪播 */
  .marquee {
    width: 100%;
    height: 47px;
    overflow: hidden;
    border-radius: 14px;
    background: var(--white);
    border: 2px solid var(--white);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .track {
    display: flex;
    height: 100%;
    width: max-content;
    animation: slide var(--dur, 20s) linear infinite;
  }
  .marquee:hover .track { animation-play-state: paused; }
  .track img {
    height: 100%;
    width: auto;
    padding: 6px 8px;
    object-fit: contain;
    flex: none;
  }
  @keyframes slide {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* 連結按鈕：扁扁的 */
  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    background: var(--white);
    border: 2px solid var(--white);
    color: var(--ink);
    text-decoration: none;
    font-size: 16px; font-weight: 700;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    border-color: var(--sky);
    background: var(--cream);
    outline: none;
  }
  .link .ico {
    width: 32px; height: 32px; flex: none;
    border-radius: 10px;
    background: var(--sky-soft);
    color: var(--sky-deep);
    display: grid; place-items: center;
  }
  .link .ico svg { width: 18px; height: 18px; fill: currentColor; }
  .link .label { flex: 1; text-align: center; margin-right: 44px; }

  footer { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .track, .zzz { animation: none; }
  }
</style>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLqCrWEIetydwjFFAclHLZx4Bi2qP5f4SA01dKWfhZm9ghLd-gajuTRYdZLlq18EvzSwj6D43j-1NJ/pub?gid=934528779&single=true&output=csv";
  const AVATAR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLqCrWEIetydwjFFAclHLZx4Bi2qP5f4SA01dKWfhZm9ghLd-gajuTRYdZLlq18EvzSwj6D43j-1NJ/pub?gid=2013702964&single=true&output=csv";
  const PX_PER_SEC = 40; // 滾動速度，數字越大越快

  const track = document.getElementById("track");

  function build(urls) {
    if (!urls.length) { track.parentElement.style.display = "none"; return; }

    const makeImg = (src) => {
      const img = new Image();
      img.src = src; img.alt = ""; img.loading = "eager"; img.decoding = "async";
      return img;
    };

    // 先放一組，若寬度不足就重複，直到超過容器寬度
    const box = track.parentElement.clientWidth;
    const half = document.createElement("div");
    half.style.display = "flex";
    let guard = 0;
    do {
      urls.forEach(u => half.appendChild(makeImg(u)));
      guard++;
    } while (guard < 60 && half.childElementCount * 47 < box * 1.2);

    // 兩份一模一樣接起來，動畫移動 50% 就能無縫循環
    track.append(...half.cloneNode(true).childNodes, ...half.childNodes);

    const setDur = () => {
      const w = track.scrollWidth / 2;
      track.style.setProperty("--dur", Math.max(w / PX_PER_SEC, 4) + "s");
    };
    setDur();
    window.addEventListener("load", setDur);
  }

  fetch(CSV_URL)
    .then(r => r.text())
    .then(text => {
      const urls = (text.match(/https?:\/\/[^\s,"']+/g) || []);
      build(urls);
    })
    .catch(() => build([]));

  // 頭貼：抓表單裡第一個網址，載入失敗就維持「問」字
  fetch(AVATAR_CSV_URL)
    .then(r => r.text())
    .then(text => {
      const url = (text.match(/https?:\/\/[^\s,"']+/) || [])[0];
      if (!url) return;
      const img = new Image();
      img.alt = "問問的頭貼";
      img.referrerPolicy = "no-referrer";
      img.onload = () => document.getElementById("avatar").replaceChildren(img);
      img.src = url;
    })
    .catch(() => {});
</script>
